<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Boing Finance">
  <title>Boing Finance</title>
  <defs>
    <radialGradient id="boing-mark-disc" cx="32%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#2a3a52"/>
      <stop offset="48%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <linearGradient id="boing-mark-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ef6ff"/>
      <stop offset="42%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="rgba(233,238,245,0.28)"/>
    </linearGradient>
    <linearGradient id="boing-mark-b" x1="0%" y1="0%" x2="8%" y2="100%">
      <stop offset="0%" stop-color="#f4f8fc"/>
      <stop offset="38%" stop-color="#7af0ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="boing-mark-bounce" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,229,255,0.22)"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <radialGradient id="boing-mark-orb" cx="38%" cy="32%" r="70%">
