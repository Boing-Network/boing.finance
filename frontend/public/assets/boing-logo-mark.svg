  <circle cx="32" cy="32" r="27.4" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="0.5"/>
  <ellipse cx="23.5" cy="21.5" rx="13" ry="8.5" fill="rgba(255,255,255,0.05)"/>

