    </radialGradient>
    <filter id="boing-mark-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.45" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
