# Cloudflare Workers Configuration for boing.finance API
# 
# IMPORTANT: The base worker name "boing-api" is used for local development only
# (`wrangler dev`); never deploy it.
# Production is the only deployed environment: boing-api-prod (via --env production).
# The former "boing-api" and "boing-api-staging" Workers were deleted from Cloudflare
# (Workers Free plan allows only 5 cron triggers per account).

name = "boing-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "10374f367672f4d19db430601db0926b"

# Environment variables
[vars]
NODE_ENV = "development"
FRONTEND_URL = "http://localhost:3000"
# Large-set NFT media collection budget (GiB). Product default 50.
NFT_MEDIA_BUDGET_GB = "50"
# LI.FI integrator fee (0.005 = 0.5%). Recipient is the wallet registered for integrator "boing.finance" on portal.li.fi.
LIFI_INTEGRATOR_FEE = "0.005"
# LIFI_FEE_RECIPIENT = "0x..."
# Worker URL for generating file URLs (auto-detected from request if not set)
# WORKER_URL = "https://boing-api-prod.nico-chikuji.workers.dev"

[env.production]
name = "boing-api-prod"

# Workers Logs: persists invocation logs and console output so production errors
# (see the global app.onError handler in src/worker.js) can be inspected in the dashboard
# or via the Workers Observability telemetry API. Free plan has a daily event cap, so the
# head sampling rate stays at 1 (all requests) only because traffic is small; lower it
# (e.g. 0.25) if the cap is hit.
[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
invocation_logs = true

[env.production.ai]
binding = "AI"

[env.production.vars]
NODE_ENV = "production"
FRONTEND_URL = "https://boing.finance"
WORKER_URL = "https://boing-api-prod.nico-chikuji.workers.dev"
NFT_MEDIA_BUDGET_GB = "50"
LIFI_INTEGRATOR_FEE = "0.005"
# Set via `wrangler secret put` (do not commit values): LIFI_API_KEY,
# LIFI_FEE_RECIPIENT (EVM), LIFI_FEE_RECIPIENT_SOL, LIFI_FEE_RECIPIENT_BTC.
# Set via `wrangler secret`: ALCHEMY_WEBHOOK_SIGNING_KEY, HELIUS_WEBHOOK_SECRET,
# HELIUS_API_KEY (or SOLANA_MAINNET_RPC / SOLANA_DEVNET_RPC) for the /api/solana/rpc proxy
# Webhook URLs: /api/webhooks/alchemy and /api/webhooks/helius

# D1 Database
# Production uses this database_id (the only deployed environment).
[[d1_databases]]
binding = "DB"
database_name = "boing-database"
database_id = "fad0eff6-b010-4310-af96-0b68fc5ebab5"

# R2 Bucket for file storage
[[r2_buckets]]
binding = "BOING_STORAGE"
bucket_name = "boing-storage"
preview_bucket_name = "boing-storage-preview"

# Environment-specific D1 databases
[[env.production.d1_databases]]
binding = "DB"
database_name = "boing-database-prod"
database_id = "fad0eff6-b010-4310-af96-0b68fc5ebab5"

# Environment-specific R2 buckets
[[env.production.r2_buckets]]
binding = "BOING_STORAGE"
bucket_name = "boing-storage"

# KV Namespace for caching (CoinGecko, The Graph, etc.)
[[kv_namespaces]]
binding = "CACHE"
id = "d6344f1c309148d0833d33e097db2e8f"
preview_id = "a7b956a54b184e42a379f8801d558a7a"

# Workers AI binding (enable for AI DeFi Assistant)
[ai]
binding = "AI"

# Secrets (set via wrangler secret put)
# ETHEREUM_RPC_URL
# POLYGON_RPC_URL
# BSC_RPC_URL
# SEPOLIA_RPC_URL
# ETHERSCAN_API_KEY
# JWT_SECRET

# Cron triggers for background jobs. Wrangler inherits a top-level [triggers] into
# every environment, so the hourly analytics cron is declared ONLY under the
# production env (the Workers Free plan allows 5 cron triggers per account).
[env.production.triggers]
crons = ["0 * * * *"] # Run every hour to collect analytics data

# Limits - Removed CPU limits for Free plan compatibility
# [limits]
# cpu_ms = 50 