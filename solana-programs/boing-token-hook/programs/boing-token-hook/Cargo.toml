[package]
name = "boing-token-hook"
version = "0.1.0"
description = "Boing SPL transfer-hook: pause, max tx, max wallet, cooldown, anti-bot"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "boing_token_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
# 0.6.x pulls solana-program 2.x while spl-pod 0.2 stays on 1.18 → duplicate ProgramError.
spl-tlv-account-resolution = "=0.5.0"
spl-transfer-hook-interface = "=0.4.1"
solana-program = "=1.18.26"
# platform-tools cargo 1.79 cannot parse edition2024 manifests; keep MSRV ≤ 1.79.
blake3 = "=1.5.5"
thiserror = "=1.0.69"
proc-macro-crate = "=3.2.0"
toml_datetime = "=0.6.8"
zeroize_derive = "=1.4.2"
bytemuck = "=1.16.3"
bytemuck_derive = "=1.8.1"
serde = { version = "=1.0.210", features = ["derive"] }
serde_derive = "=1.0.210"
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
jobserver = "=0.1.32"
unicode-segmentation = "=1.12.0"
proc-macro2 = "=1.0.86"
